<body>

    <!-- ======== LANDING PAGE (Public) ======== -->
    <div id="landing-page" class="landing-page">
        <!-- Rendered by landing.js -->
    </div>

    <!-- ======== LOGIN PAGE ======== -->
    <div id="login-page" class="login-page hidden">
        <!-- Rendered by login.js -->
    </div>

    <!-- ======== APP LAYOUT ======== -->
    <div id="app-layout" class="app-layout hidden">

        <!-- Mobile Header -->
        <header class="mobile-header" id="mobile-header">
            <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <h1 class="mobile-title">Cipta Karya</h1>
            <div class="mobile-avatar" id="mobile-user-avatar"></div>
        </header>

        <!-- Sidebar Overlay (mobile) -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <!-- Logo -->
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 21h18"/><path d="M5 21V7l8-4v18"/>
                            <path d="M19 21V11l-6-4"/>
                            <path d="M9 9v.01"/><path d="M9 12v.01"/><path d="M9 15v.01"/><path d="M9 18v.01"/>
                        </svg>
                    </div>
                    <div class="logo-text">
                        <span class="logo-name">Cipta Karya</span>
                        <span class="logo-subtitle">Document Admin v2</span>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="sidebar-nav" id="sidebar-nav">
                <div class="nav-section-label">MENU UTAMA</div>

                <a href="#/beranda" class="nav-link" data-page="beranda" id="nav-beranda">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Beranda</span>
                </a>

                <a href="#/dashboard" class="nav-link" data-page="dashboard" id="nav-dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                    <span>Dashboard</span>
                </a>

                <a href="#/documents" class="nav-link" data-page="documents" id="nav-documents">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    <span>Dokumen</span>
                </a>

                <a href="#/projects" class="nav-link" data-page="projects" id="nav-projects">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                    </svg>
                    <span>Proyek</span>
                </a>

                <div class="nav-section-label">ADMINISTRASI</div>

                <a href="#/users" class="nav-link" data-page="users" id="nav-users">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>

                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>Pengguna</span>
                </a>

                <a href="#/activity" class="nav-link" data-page="activity" id="nav-activity">

                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>Log Aktivitas</span>
                </a>

                <a href="#/settings" class="nav-link" data-page="settings" id="nav-settings">

                        <circle cx="12" cy="12" r="3"/>

                    </svg>
                    <span>Pengaturan</span>
                </a>
            </nav>

            <!-- User Info + Logout -->
            <div class="sidebar-footer">
                <div class="sidebar-user" id="sidebar-user-info">
                    <div class="sidebar-user-avatar" id="sidebar-avatar">BS</div>
                    <div class="sidebar-user-details">
                        <span class="sidebar-user-name" id="sidebar-username">Budi Santoso</span>
                        <span class="sidebar-user-role" id="sidebar-userrole">Administrator</span>
                    </div>
                </div>
                <button id="logout-btn" class="logout-btn" title="Keluar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Pages rendered dynamically here -->
        </main>
    </div>

    <!-- ======== TOAST CONTAINER ======== -->
    <div id="toast-container" class="toast-container"></div>

    <!-- ======== MODAL CONTAINER ======== -->
    <div id="modal-container" class="modal-container hidden"></div>

    <!-- ======== SCRIPTS ======== -->
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/landing.js"></script>
    <script src="js/pages/login.js"></script>
    <script src="js/pages/beranda.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/documents.js"></script>
    <script src="js/pages/projects.js"></script>
    <script src="js/pages/users.js"></script>
    <script src="js/pages/activity.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js"></script>
    <script>
        console.log('App Loaded');
        window.onerror = function(msg, url, line, col, error) {
            console.error('GLOBAL ERROR:', msg, url, line, col, error);
            document.body.innerHTML += '<div style="color:red;z-index:9999;position:fixed;top:0;left:0;background:white;padding:10px;">' + msg + '</div>';
        };
        window.onunhandledrejection = function(e) {
            console.error('UNHANDLED REJECTION:', e.reason);
            document.body.innerHTML += '<div style="color:red;z-index:9999;position:fixed;top:50px;left:0;background:white;padding:10px;">Unhandled Promise: ' + e.reason + '</div>';
        };

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registered'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
